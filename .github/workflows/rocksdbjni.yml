name: rocksdbjni
on: [push, pull_request]
jobs:
  # ======================== Linux ======================= #
  
  # Both Linux libraries are built in an Ubuntu 20.04 container by yamcs-release/build-linux-jni.sh
  # (glibc 2.31 baseline; amd64 with -march=core2 for old CPUs, arm64 with the armv8-a baseline).
  build-linux-amd64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build RocksDBJava Static Library
      run: yamcs-release/build-linux-jni.sh 4
    - uses: actions/upload-artifact@v4
      with:
         name: linux-amd64
         path: java/target/**
         if-no-files-found: error
         retention-days: 1

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v4
    - name: Build RocksDBJava Static Library
      run: yamcs-release/build-linux-jni.sh 4
    - uses: actions/upload-artifact@v4
      with:
         name: linux-arm64
         path: java/target/**
         if-no-files-found: error
         retention-days: 1

  # ======================== Windows ======================= #
  build-windows-amd64:
   # if: false
    runs-on: windows-2022
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
         distribution: 'temurin'
         java-version: '11'
    - uses: "./.github/actions/windows-build-steps"
    - name: libraries
      uses: actions/upload-artifact@v4
      with:
         name: windows-amd64
         path: "${{ github.workspace }}/build/java/Release/librocksdbjni-win64.dll"
         if-no-files-found: error
         retention-days: 1
  
  # ======================== OS X ======================= #
  
  build-macosx:
    #if: false
    runs-on: macos-14
    env:
      # CMake 4 on the runner refuses projects declaring cmake_minimum_required < 3.5 (snappy 1.1.8)
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
    - uses: actions/checkout@v4
    - uses: maxim-lobanov/setup-xcode@v1.6.0
      with:
        xcode-version: latest-stable
    - uses: "./.github/actions/increase-max-open-files-on-macos"
    - uses: "./.github/actions/install-gflags-on-macos"
    # the JDK is only needed for the JNI headers; the Java classes in the release jar come from the Linux build
    - uses: actions/setup-java@v4
      with:
         distribution: 'temurin'
         java-version: '11'
    - uses: "./.github/actions/pre-steps-macos"
    - name: Set Java Environment
      run: |-
        echo "JAVA_HOME=${JAVA_HOME}"
        which java && java -version
        which javac && javac -version
    - name: Build RocksDBJava x86 and ARM Static Libraries
      run: PORTABLE=1 make V=1 J=4 -j4 rocksdbjavastaticosx
    - uses: actions/upload-artifact@v4
      with:
         name: macosx
         path: java/target/librocksdbjn*.jnilib
         if-no-files-found: error
         retention-days: 1

  # ======================== Final JAR assembly ======================= #
  package:
    runs-on: ubuntu-latest
    needs: [build-linux-amd64, build-linux-arm64, build-macosx, build-windows-amd64]
    steps:
    - uses: actions/checkout@v4
    - name: Download Linux AMD64 artifact
      uses: actions/download-artifact@v4
      with:
        name: linux-amd64
        path: build
    - name: Download Linux ARM64 artifact
      uses: actions/download-artifact@v4
      with:
        name: linux-arm64
        path: build
    - name: Download macOS artifact
      uses: actions/download-artifact@v4
      with:
        name: macosx
        path: build
    - name: Download Windows AMD64 artifact
      uses: actions/download-artifact@v4
      with:
        name: windows-amd64
        path: build
    #- name: Create JAR with native libraries
    #  run: |
    #      tar
    - name: Upload combined JAR artifact
      uses: actions/upload-artifact@v4
      with:
         name: "rocksdbjni-jar"
         path: build
    
